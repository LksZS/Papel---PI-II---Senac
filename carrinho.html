<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho - Papelaria</title>
  <link rel="stylesheet" href="css/carrinho.css">
</head>
<body>
  <header>
    <h1>Papelaria</h1>
    <nav>
      <!-- Ajuste os links para os nomes de arquivo/rotas do grupo -->
      <a href="index.html#inicio">Início</a>
      <a href="index.html#produtos">Produtos</a>
      <a href="login.html">Login</a>
      <a href="clientes.html">Cadastro</a>
      <a href="produtos.html">Manutenção</a>
      <a href="carrinho.html">Carrinho (<span id="contador">0</span>)</a>
    </nav>
  </header>

  <main>
    <section class="pagina">
      <h2>Seu carrinho</h2>

      <!-- Mostrado quando não há itens -->
      <div id="vazio" class="vazio" hidden>
        <p>Seu carrinho está vazio.</p>
        <a class="botao" href="index.html#produtos">Ver produtos</a>
        <!-- Botão só para testar sem a página de produtos; remover na versão final -->
        <button id="exemplo" class="botao secundario" type="button">Adicionar itens de exemplo</button>
      </div>

      <!-- Mostrado quando há itens -->
      <div id="conteudo" class="layout" hidden>
        <div id="itens" class="itens"></div>

        <aside class="resumo">
          <h3>Resumo do pedido</h3>
          <p>Itens: <strong id="resumo-qtd">0</strong></p>
          <p class="total">Total: <strong id="resumo-total">R$ 0,00</strong></p>
          <button id="finalizar" class="botao" type="button">Finalizar pedido</button>
          <button id="esvaziar" class="botao secundario" type="button">Esvaziar carrinho</button>
        </aside>
      </div>

      <p id="mensagem" class="mensagem" role="status" hidden></p>
    </section>
  </main>

  <footer>© 2026 Papelaria</footer>

  <script src="js/carrinho.js"></script>
</body>
</html>
