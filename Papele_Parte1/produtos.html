<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papelê - Manutenção de produtos</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/produtos.css">
</head>
<body>
  <header>
    <h1><a href="index.html">✏️ Papelê</a></h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="index.html#produtos">Produtos</a>
      <a href="index.html#sobre">Sobre</a>
      <a href="carrinho.html">🛒 Carrinho</a>
      <a href="produtos.html" class="ativo">Manutenção</a>
      <a href="login.html">Login</a>
      <a href="clientes.html">Cadastro</a>
    </nav>
  </header>

  <main>
    <section class="pagina">
      <h2>Manutenção de produtos</h2>
      <p class="descricao">Cadastre, altere e exclua os produtos da loja.</p>

      <p id="mensagem" class="mensagem" role="status"></p>

      <div class="admin">
        <!-- Formulário: serve para cadastrar e para editar -->
        <form id="formProduto" class="formulario" novalidate>
          <h3 id="tituloForm">Novo produto</h3>

          <!-- Guarda o id do produto que está sendo editado (vazio = novo) -->
          <input type="hidden" id="produtoId">

          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" maxlength="50" placeholder="Ex.: Lápis de cor">
            <span class="erro" id="erroNome"></span>
          </div>

          <div class="campo">
            <label for="categoria">Categoria</label>
            <select id="categoria">
              <option value="">Selecione...</option>
              <option value="Escrita">Escrita</option>
              <option value="Cadernos">Cadernos</option>
              <option value="Mochilas">Mochilas</option>
            </select>
            <span class="erro" id="erroCategoria"></span>
          </div>

          <div class="campo">
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" step="0.01" min="0.01" placeholder="0,00">
            <span class="erro" id="erroPreco"></span>
          </div>

          <div class="campo">
            <label for="imagem">Imagem (emoji)</label>
            <input type="text" id="imagem" maxlength="4" placeholder="Ex.: ✏️">
            <span class="erro" id="erroImagem"></span>
          </div>

          <div class="acoes-form">
            <button type="submit" id="botaoSalvar" class="botao">Cadastrar produto</button>
            <button type="button" id="botaoCancelar" class="botao-secundario" hidden>Cancelar edição</button>
          </div>
        </form>

        <!-- Tabela: lista os produtos cadastrados -->
        <div class="lista-admin">
          <div class="topo-lista">
            <h3>Produtos cadastrados</h3>
            <span id="total"></span>
          </div>

          <div class="tabela-container">
            <table>
              <thead>
                <tr>
                  <th>Imagem</th>
                  <th>Nome</th>
                  <th>Categoria</th>
                  <th>Preço</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaProdutos"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>Papelê - Projeto Integrador II · © 2026</p>
  </footer>
  <script src="js/usuario.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
